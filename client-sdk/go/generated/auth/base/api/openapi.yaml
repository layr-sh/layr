openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/auth/anonymous:
    post:
      description: "Creates an ephemeral guest user account in auth.users with role\
        \ 'authenticated', is_anonymous set to true, null email/phone, and optional\
        \ initial profile properties. Publishes auth.user.signed_up event and issues\
        \ an Ed25519 JWT access token, rotated refresh token in auth.sessions, and\
        \ authentication cookies."
      operationId: auth__anonymous__sign_in
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SignInAnonymousInput"
        description: Request body for auth.SignInAnonymousInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Initialize or sign in an anonymous guest user account
      tags:
      - Anonymous
      x-sdk-group-name:
      - auth
      - anonymous
      x-sdk-method-name: sign_in
  /v1/auth/mfa:
    delete:
      description: "Disables TOTP multi-factor authentication on auth.users for the\
        \ authenticated user, clears the encrypted MFA secret, and publishes auth.mfa.disabled\
        \ event. Requires authenticated user session."
      operationId: auth__mfa__disable
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: MFA disabled on account
      summary: Disable multi-factor authentication on user account
      tags:
      - MFA
      x-sdk-group-name:
      - auth
      - mfa
      x-sdk-method-name: disable
    post:
      description: "Generates a cryptographic RFC 6238 TOTP secret, stores it temporarily\
        \ encrypted in the session cache, and returns an otpauth:// URI and QR code\
        \ payload compatible with Google Authenticator, 1Password, or Authy. Requires\
        \ authenticated user session."
      operationId: auth__mfa__setup
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupMFAResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/SetupMFAResponse"
          description: OK
      summary: Generate TOTP secret and setup URI for authenticator enrollment
      tags:
      - MFA
      x-sdk-group-name:
      - auth
      - mfa
      x-sdk-method-name: setup
  /v1/auth/mfa/challenge:
    post:
      description: "Verifies a 6-digit TOTP passcode against the user's enrolled MFA\
        \ secret using a short-lived challenge ticket (5-minute TTL) issued during\
        \ password sign-in. On verification, issues an Ed25519 JWT access token, rotated\
        \ refresh token, and creates a session record in auth.sessions."
      operationId: auth__mfa__challenge
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ChallengeMFAInput"
        description: Request body for auth.ChallengeMFAInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Verify MFA challenge ticket with TOTP passcode
      tags:
      - MFA
      x-sdk-group-name:
      - auth
      - mfa
      x-sdk-method-name: challenge
  /v1/auth/mfa/verify:
    post:
      description: "Validates the initial 6-digit TOTP code against the pending setup\
        \ secret, sets mfa_enabled to true on auth.users, stores the AES-encrypted\
        \ secret permanently, and publishes auth.mfa.enabled event. Requires authenticated\
        \ user session."
      operationId: auth__mfa__verify
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/VerifyMFAInput"
        description: Request body for auth.VerifyMFAInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Verify initial TOTP code to complete MFA enrollment
      tags:
      - MFA
      x-sdk-group-name:
      - auth
      - mfa
      x-sdk-method-name: verify
  /v1/auth/otp:
    post:
      description: "Generates a single-use 6-digit numeric OTP with configurable TTL\
        \ and rate limiting, hashes it with Argon2id, stores it in auth.otps, and\
        \ dispatches it via configured email or SMS provider (Twilio, Vonage, SendGrid,\
        \ Resend, or SMTP)."
      operationId: auth__otp__send
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SendOTPInput"
        description: Request body for auth.SendOTPInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: OTP verification code dispatched
      summary: Request a one-time password verification code via email or SMS
      tags:
      - OTP
      x-sdk-group-name:
      - auth
      - otp
      x-sdk-method-name: send
  /v1/auth/otp/verify:
    post:
      description: "Validates the 6-digit OTP code against stored Argon2id hash in\
        \ auth.otps. On successful verification, marks contact method verified, issues\
        \ an Ed25519 JWT access token and rotated refresh token, and creates an active\
        \ session in auth.sessions."
      operationId: auth__otp__verify
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/VerifyOTPInput"
        description: Request body for auth.VerifyOTPInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Verify one-time password code and issue authenticated session
      tags:
      - OTP
      x-sdk-group-name:
      - auth
      - otp
      x-sdk-method-name: verify
  /v1/auth/passkeys/sign-in:
    post:
      description: "Initiates WebAuthn / FIDO2 assertion ceremony, generating a cryptographic\
        \ challenge and credential request options for the client browser or authenticator\
        \ hardware."
      operationId: auth__passkeys__sign_in__begin
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInOptions"
            application/xml:
              schema:
                $ref: "#/components/schemas/SignInOptions"
          description: OK
      summary: Begin WebAuthn passkey authentication ceremony
      tags:
      - Passkeys Sign In
      x-sdk-group-name:
      - auth
      - passkeys
      - sign_in
      x-sdk-method-name: begin
  /v1/auth/passkeys/sign-in/verify:
    post:
      description: "Verifies the client's WebAuthn assertion signature against the\
        \ registered public key and signature counter stored in auth.passkeys. Issues\
        \ an Ed25519 JWT access token, refresh token, and session record in auth.sessions."
      operationId: auth__passkeys__sign_in__verify
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/VerifyPasskeySignInInput"
        description: Request body for auth.VerifyPasskeySignInInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Verify WebAuthn passkey assertion signature and issue session
      tags:
      - Passkeys Sign In
      x-sdk-group-name:
      - auth
      - passkeys
      - sign_in
      x-sdk-method-name: verify
  /v1/auth/passkeys/sign-up:
    post:
      description: "Initiates WebAuthn / FIDO2 credential creation ceremony, generating\
        \ an attestation challenge, relying party metadata, and user entity options\
        \ for hardware or platform passkey enrollment."
      operationId: auth__passkeys__sign_up__begin
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/BeginPasskeySignUpInput"
        description: Request body for auth.BeginPasskeySignUpInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpOptions"
            application/xml:
              schema:
                $ref: "#/components/schemas/SignUpOptions"
          description: OK
      summary: Begin WebAuthn passkey registration ceremony
      tags:
      - Passkeys Sign Up
      x-sdk-group-name:
      - auth
      - passkeys
      - sign_up
      x-sdk-method-name: begin
  /v1/auth/passkeys/sign-up/verify:
    post:
      description: "Validates client attestation response and public key, stores credential\
        \ record in auth.passkeys, creates user identity, and issues an authenticated\
        \ session with Ed25519 JWT tokens."
      operationId: auth__passkeys__sign_up__verify
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/VerifyPasskeySignUpInput"
        description: Request body for auth.VerifyPasskeySignUpInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Verify WebAuthn passkey registration attestation and store credential
      tags:
      - Passkeys Sign Up
      x-sdk-group-name:
      - auth
      - passkeys
      - sign_up
      x-sdk-method-name: verify
  /v1/auth/password-reset/confirm:
    post:
      description: "Verifies single-use password recovery verification code, enforces\
        \ password complexity and breach checks, updates password hash using Argon2id\
        \ key derivation in auth.users, and revokes existing sessions."
      operationId: auth__password_reset__confirm
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetInput"
        description: Request body for auth.ConfirmPasswordResetInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Password reset confirmed
      summary: Confirm password reset with verification code and new password
      tags:
      - Password Reset
      x-sdk-group-name:
      - auth
      - password_reset
      x-sdk-method-name: confirm
  /v1/auth/password-reset/request:
    post:
      description: "Initiates password recovery for registered user, generating an\
        \ Argon2id-hashed single-use verification code with cooldown guards and dispatching\
        \ it to registered email or SMS destination."
      operationId: auth__password_reset__request
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/RequestPasswordResetInput"
        description: Request body for auth.RequestPasswordResetInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Password reset code sent
      summary: Request a password reset verification code via email or SMS
      tags:
      - Password Reset
      x-sdk-group-name:
      - auth
      - password_reset
      x-sdk-method-name: request
  /v1/auth/sign-in:
    post:
      description: "Authenticates application user with email or normalized E.164\
        \ phone and password. Verifies Argon2id hash, checks account lockout status\
        \ and breach flags. If MFA is enrolled, returns an ephemeral mfa_ticket challenge;\
        \ otherwise issues Ed25519 JWT access token, refresh token in auth.sessions,\
        \ and session cookies."
      operationId: auth__sign_in
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SignInInput"
        description: Request body for auth.SignInInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Authenticate with email or phone and password
      tags:
      - Sign In
      x-sdk-group-name:
      - auth
      x-sdk-method-name: sign_in
  /v1/auth/sign-out:
    post:
      description: "Revokes active refresh token, deletes corresponding session record\
        \ from auth.sessions, clears session cookies, and emits auth.user.signed_out\
        \ event."
      operationId: auth__sign_out
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Signed out successfully
      summary: Revoke active session and refresh token
      tags:
      - Sign Out
      x-sdk-group-name:
      - auth
      x-sdk-method-name: sign_out
  /v1/auth/sign-up:
    post:
      description: "Registers a new application user account with email or normalized\
        \ E.164 phone, password complexity validation, breach detection, and Argon2id\
        \ key derivation. Supports seamless upgrade of anonymous guest accounts. Dispatches\
        \ verification code if confirmation is required; otherwise issues Ed25519\
        \ JWT tokens."
      operationId: auth__sign_up
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SignUpInput"
        description: Request body for auth.SignUpInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Register a new application user with password
      tags:
      - Sign Up
      x-sdk-group-name:
      - auth
      x-sdk-method-name: sign_up
  /v1/auth/token/refresh:
    post:
      description: "Validates submitted refresh token against SHA-256 hash in auth.sessions,\
        \ checks session expiry and user lock status, rotates refresh token, and issues\
        \ a freshly signed Ed25519 JWT access token with updated claims resolved from\
        \ public.auth_claims."
      operationId: auth__token__refresh
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
        description: Request body for auth.RefreshTokenInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: OK
      summary: Exchange refresh token for fresh JWT access token
      tags:
      - Token
      x-sdk-group-name:
      - auth
      - token
      x-sdk-method-name: refresh
  /v1/auth/user:
    delete:
      description: "Permanently deletes the authenticated user from auth.users, cascading\
        \ deletion across auth.sessions, auth.identities, auth.passkeys, and user\
        \ properties. Clears authentication cookies and emits auth.user.deleted event.\
        \ Requires authenticated user session."
      operationId: auth__user__delete
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Account deleted successfully
      summary: Permanently delete authenticated user account
      tags:
      - User
      x-sdk-group-name:
      - auth
      - user
      x-sdk-method-name: delete
    get:
      description: "Retrieves authenticated user profile from auth.users, including\
        \ email, phone, verification timestamps, role, custom properties JSON, MFA\
        \ enrollment status, and lockout flags. Requires authenticated user session."
      operationId: auth__user__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
          description: OK
      summary: Get profile and verification details of authenticated user
      tags:
      - User
      x-sdk-group-name:
      - auth
      - user
      x-sdk-method-name: get
  /v1/auth/user/email:
    patch:
      description: "Asserts uniqueness of the new email address, generates an Argon2id-hashed\
        \ single-use verification code, and dispatches it to the requested email.\
        \ The address is updated once verified. Requires authenticated user session."
      operationId: auth__user__email__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateUserEmailInput"
        description: Request body for auth.UpdateUserEmailInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Email verification code sent
      summary: Request update of authenticated user email address
      tags:
      - User Email
      x-sdk-group-name:
      - auth
      - user
      - email
      x-sdk-method-name: update
  /v1/auth/user/email/verification/confirm:
    post:
      description: "Verifies submitted single-use code against pending email verification\
        \ record, sets email_verified_at timestamp in auth.users, and updates primary\
        \ email if part of an address change flow. Requires authenticated user session."
      operationId: auth__user__email__verification__confirm
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ConfirmEmailVerificationInput"
        description: Request body for auth.ConfirmEmailVerificationInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Email successfully verified
      summary: Confirm email verification code
      tags:
      - User Email Verification
      x-sdk-group-name:
      - auth
      - user
      - email
      - verification
      x-sdk-method-name: confirm
  /v1/auth/user/email/verification/request:
    post:
      description: Generates and dispatches a single-use verification code to the
        authenticated user's registered unverified email address. Rate-limited by
        IP and user cooldowns. Requires authenticated user session.
      operationId: auth__user__email__verification__request
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/RequestEmailVerificationInput"
        description: Request body for auth.RequestEmailVerificationInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Email verification code sent
      summary: Request an email verification code for current email
      tags:
      - User Email Verification
      x-sdk-group-name:
      - auth
      - user
      - email
      - verification
      x-sdk-method-name: request
  /v1/auth/user/export:
    post:
      description: "Exports full personal data graph associated with the authenticated\
        \ user, including profile metadata, linked authentication identities, active\
        \ sessions, and passkey registrations in portable JSON format. Requires authenticated\
        \ user session."
      operationId: auth__user__export
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportUserResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ExportUserResponse"
          description: OK
      summary: Export comprehensive user account data graph (GDPR Article 20)
      tags:
      - User
      x-sdk-group-name:
      - auth
      - user
      x-sdk-method-name: export
  /v1/auth/user/passkeys:
    get:
      description: "Retrieves all registered WebAuthn / FIDO2 passkey credentials\
        \ for the authenticated user from auth.passkeys, including credential IDs,\
        \ friendly names, creation timestamps, and last used dates. Requires authenticated\
        \ user session."
      operationId: auth__user__passkeys__list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Passkey"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/Passkey"
                type: array
                default: null
          description: OK
