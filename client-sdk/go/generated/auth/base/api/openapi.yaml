                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Phone verification code sent
      summary: Request update of authenticated user phone number
      tags:
      - User Phone
      x-sdk-group-name:
      - auth
      - user
      - phone
      x-sdk-method-name: update
  /v1/auth/user/phone/verification/confirm:
    post:
      description: "Verifies submitted single-use SMS code against pending verification\
        \ record, updates phone_verified_at in auth.users, and marks phone as verified.\
        \ Requires authenticated user session."
      operationId: auth__user__phone__verification__confirm
      requestBody:
        content:
          '*/*':
            schema:
