      x-sdk-method-name: update
  /v1/auth/user/sessions:
    get:
      description: "Returns active sessions from auth.sessions for the authenticated\
        \ user, detailing IP address, user agent, creation date, expiry timestamp,\
        \ and a flag indicating the current device session. Requires authenticated\
        \ user session."
      operationId: auth__user__sessions__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
          description: OK
      summary: List active sessions for current user
      tags:
      - User Sessions
      x-sdk-group-name:
      - auth
      - user
      - sessions
      x-sdk-method-name: list
  /v1/auth/user/sessions/revoke-others:
    post:
      description: "Revokes all active sessions in auth.sessions belonging to the\
        \ authenticated user except the current device session, invalidating other\
        \ refresh tokens immediately. Requires authenticated user session."
      operationId: auth__user__sessions__revoke_others
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeOtherSessionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RevokeOtherSessionsResponse"
          description: OK
      summary: Sign out of all other devices and sessions
      tags:
      - User Sessions
      x-sdk-group-name:
      - auth
      - user
      - sessions
      x-sdk-method-name: revoke_others
  /v1/auth/user/sessions/{session_id}:
    delete:
      description: "Deletes a specific session record from auth.sessions belonging\
        \ to the authenticated user, terminating access for that device. Requires\
        \ authenticated user session."
      operationId: auth__user__sessions__revoke
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Session revoked
      summary: Revoke a specific user session by ID
      tags:
      - User Sessions
      x-sdk-group-name:
      - auth
      - user
      - sessions
      x-sdk-method-name: revoke
  /v1/oauth/token:
    post:
      description: "Exchanges an OAuth2 / OIDC authorization code (with PKCE code_verifier\
        \ challenge verification) or refresh token for an Ed25519 JWT ID token, access\
        \ token, and refresh token according to OpenID Connect Core 1.0 specifications."
      operationId: auth__oidc__token
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueOIDCTokenResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/IssueOIDCTokenResponse"
          description: OK
      summary: Exchange authorization code or refresh token for OpenID Connect tokens
      tags:
      - OIDC
      x-sdk-group-name:
      - auth
      - oidc
      x-sdk-method-name: token
  /v1/oauth/userinfo:
    get:
      description: "Retrieves standard OpenID Connect profile claims (sub, email,\
        \ email_verified, phone, phone_verified, name) for the authenticated caller\
        \ bearing a valid Bearer access token."
      operationId: auth__oidc__userinfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOIDCUserInfoResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetOIDCUserInfoResponse"
          description: OK
      summary: Retrieve OpenID Connect Core 1.0 user claims
      tags:
      - OIDC
      x-sdk-group-name:
      - auth
      - oidc
      x-sdk-method-name: userinfo
