  /v1/auth/user/password:
    patch:
      description: "Updates the account password in auth.users. Verifies current password\
        \ if one is already set, enforces password complexity and breach checks, and\
        \ rehashes with Argon2id. Prohibited on anonymous accounts. Requires authenticated\
        \ user session."
      operationId: auth__user__password__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateUserPasswordInput"
        description: Request body for auth.UpdateUserPasswordInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Password updated successfully
      summary: Change or set password for current user
      tags:
      - User Password
      x-sdk-group-name:
      - auth
      - user
      - password
      x-sdk-method-name: update
  /v1/auth/user/phone:
    patch:
      description: "Normalizes new phone number to E.164, verifies uniqueness in auth.users,\
        \ generates single-use verification code, and dispatches via SMS. Requires\
        \ authenticated user session."
      operationId: auth__user__phone__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateUserPhoneInput"
        description: Request body for auth.UpdateUserPhoneInput
        required: true
      responses:
        "200":
          content:
