      x-sdk-group-name:
      - auth
      - user
      - phone
      - verification
      x-sdk-method-name: confirm
  /v1/auth/user/phone/verification/request:
    post:
      description: Generates and dispatches a single-use verification code via SMS
        to the authenticated user's registered phone number. Requires authenticated
        user session.
      operationId: auth__user__phone__verification__request
      requestBody:
        content:
