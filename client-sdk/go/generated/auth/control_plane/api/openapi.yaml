openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/_/auth/config:
    get:
      description: "Returns active dynamic authentication settings from auth.config\
        \ including password strength rules, session TTLs, rate limits, MFA policies,\
        \ and enabled OAuth providers, with client secrets projected as boolean indicators.\
        \ Requires auth:config.read scope."
      operationId: auth__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Retrieve dynamic runtime authentication configuration
      tags:
      - Config
      x-sdk-group-name:
      - auth
      - config
      x-sdk-method-name: get
    put:
      description: Updates dynamic authentication configuration parameters in auth.config
        without requiring server restarts. Automatically envelope-encrypts newly supplied
        third-party OAuth provider secrets with AES-256-GCM using the master encryption
        key. Requires auth:config.write scope.
      operationId: auth__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for auth.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update dynamic runtime authentication configuration
      tags:
      - Config
      x-sdk-group-name:
      - auth
      - config
      x-sdk-method-name: update
  /v1/_/auth/stats:
    get:
      description: "Returns directory-wide application user, credential, and session\
        \ counts from a consistent database snapshot. Active sessions exclude expired,\
        \ idle, and locked-user sessions. Requires auth:stats.read scope."
      operationId: auth__stats__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/StatsResponse"
          description: OK
      summary: Get application authentication statistics
      tags:
      - Stats
      x-sdk-group-name:
      - auth
      - stats
      x-sdk-method-name: get
  /v1/_/auth/users:
    get:
      description: "Queries auth.users with pagination, text search over email/phone,\
        \ role filters, and verification status. Returns user metadata and creation\
        \ timestamps. Requires auth:user.read scope."
      operationId: auth__users__list
      parameters:
      - description: "Maximum number of items to return (default 50, maximum 1000)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: Number of items to skip before returning results (default 0)
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Filter users by role name
        explode: true
        in: query
        name: role
        required: false
        schema:
          type: string
        style: form
      - description: Case-insensitive substring search matching email or phone number
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
          description: OK
      summary: List registered application users with filtering and pagination
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: list
    post:
      description: "Directly provisions a new user record in auth.users with specified\
        \ email, normalized phone, Argon2id password hash, role, custom properties,\
        \ and email/phone verification flags. Emits auth.user.created event. Requires\
        \ auth:user.write scope."
      operationId: auth__users__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateUserInput"
        description: Request body for auth.CreateUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Create an application user account via control plane
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: create
  /v1/_/auth/users/{user_id}:
    delete:
      description: "Permanently deletes application user from auth.users, cascading\
        \ deletion to all active sessions, linked identities, and passkeys. Emits\
        \ auth.user.deleted event. Requires auth:user.write scope."
      operationId: auth__users__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: User deleted
      summary: Permanently delete an application user and cascade sessions
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: delete
    get:
      description: "Retrieves complete user record from auth.users by UUID, including\
        \ verification timestamps, role, custom properties JSON, MFA status, lockout\
        \ metadata, and linked authentication identities. Requires auth:user.read\
        \ scope."
      operationId: auth__users__get
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Get detailed application user record by UUID
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: get
  /v1/_/auth/users/{user_id}/lock:
    delete:
      description: "Clears locked_until timestamp in auth.users, restoring authentication\
        \ capabilities for a user previously locked by control plane action or brute-force\
        \ protection. Requires auth:user.write scope."
      operationId: auth__users__unlock
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Unlock application user account and restore login access
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: unlock
    post:
      description: "Sets locked_until timestamp on auth.users to prevent further authentication,\
        \ and immediately deletes all active sessions in auth.sessions. Emits auth.user.locked\
        \ event. Requires auth:user.write scope."
      operationId: auth__users__lock
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/LockUserInput"
        description: Request body for auth.LockUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Lock application user account and revoke active sessions
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: lock
  /v1/_/auth/users/{user_id}/sessions:
    get:
      description: "Returns all active sessions from auth.sessions for the specified\
        \ user ID, detailing client IP, user agent, expiration time, and creation\
        \ timestamp. Requires auth:user.read scope."
      operationId: auth__users__sessions__list
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUserSessionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListUserSessionsResponse"
          description: OK
      summary: List active sessions for an application user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - auth
      - users
      - sessions
      x-sdk-method-name: list
  /v1/_/auth/users/{user_id}/sessions/revoke:
    post:
      description: "Deletes all active sessions from auth.sessions for the specified\
        \ user ID, invalidating all outstanding refresh tokens and forcing re-authentication.\
        \ Requires auth:user.write scope."
      operationId: auth__users__sessions__revoke
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Sessions revoked
      summary: Revoke all active sessions for an application user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - auth
      - users
      - sessions
      x-sdk-method-name: revoke
