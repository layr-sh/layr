openapi: 3.1.0
info:
  description: Unified Base Client and Protected Control Plane APIs for Layr Platform
  title: Layr Unified API Engine
  version: 1.0.0
servers:
- url: /
paths:
  /v1/_/auth/config:
    get:
      description: "Returns active dynamic authentication settings from auth.config\
        \ including password strength rules, session TTLs, rate limits, MFA policies,\
        \ and enabled OAuth providers, with client secrets projected as boolean indicators.\
        \ Requires auth:config.read scope."
      operationId: auth__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Retrieve dynamic runtime authentication configuration
      tags:
      - Config
      x-sdk-group-name:
      - auth
      - config
      x-sdk-method-name: get
    put:
      description: Updates dynamic authentication configuration parameters in auth.config
        without requiring server restarts. Automatically envelope-encrypts newly supplied
        third-party OAuth provider secrets with AES-256-GCM using the master encryption
        key. Requires auth:config.write scope.
      operationId: auth__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for auth.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update dynamic runtime authentication configuration
      tags:
      - Config
      x-sdk-group-name:
      - auth
      - config
      x-sdk-method-name: update
  /v1/_/auth/users:
    get:
      description: "Queries auth.users with pagination, text search over email/phone,\
        \ role filters, and verification status. Returns user metadata and creation\
        \ timestamps. Requires auth:user.read scope."
      operationId: auth__users__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
          description: OK
      summary: List registered application users with filtering and pagination
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: list
    post:
      description: "Directly provisions a new user record in auth.users with specified\
        \ email, normalized phone, Argon2id password hash, role, custom properties,\
        \ and email/phone verification flags. Emits auth.user.created event. Requires\
        \ auth:user.write scope."
      operationId: auth__users__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateUserInput"
        description: Request body for auth.CreateUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Create an application user account via control plane
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: create
  /v1/_/auth/users/{user_id}:
    delete:
      description: "Permanently deletes application user from auth.users, cascading\
        \ deletion to all active sessions, linked identities, and passkeys. Emits\
        \ auth.user.deleted event. Requires auth:user.write scope."
      operationId: auth__users__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: User deleted
      summary: Permanently delete an application user and cascade sessions
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: delete
    get:
      description: "Retrieves complete user record from auth.users by UUID, including\
        \ verification timestamps, role, custom properties JSON, MFA status, lockout\
        \ metadata, and linked authentication identities. Requires auth:user.read\
        \ scope."
      operationId: auth__users__get
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Get detailed application user record by UUID
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: get
  /v1/_/auth/users/{user_id}/lock:
    delete:
      description: "Clears locked_until timestamp in auth.users, restoring authentication\
        \ capabilities for a user previously locked by control plane action or brute-force\
        \ protection. Requires auth:user.write scope."
      operationId: auth__users__unlock
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Unlock application user account and restore login access
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: unlock
    post:
      description: "Sets locked_until timestamp on auth.users to prevent further authentication,\
        \ and immediately deletes all active sessions in auth.sessions. Emits auth.user.locked\
        \ event. Requires auth:user.write scope."
      operationId: auth__users__lock
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/LockUserInput"
        description: Request body for auth.LockUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Lock application user account and revoke active sessions
      tags:
      - Users
      x-sdk-group-name:
      - auth
      - users
      x-sdk-method-name: lock
  /v1/_/auth/users/{user_id}/sessions:
    get:
      description: "Returns all active sessions from auth.sessions for the specified\
        \ user ID, detailing client IP, user agent, expiration time, and creation\
        \ timestamp. Requires auth:user.read scope."
      operationId: auth__users__sessions__list
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUserSessionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListUserSessionsResponse"
          description: OK
      summary: List active sessions for an application user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - auth
      - users
      - sessions
      x-sdk-method-name: list
  /v1/_/auth/users/{user_id}/sessions/revoke:
    post:
      description: "Deletes all active sessions from auth.sessions for the specified\
        \ user ID, invalidating all outstanding refresh tokens and forcing re-authentication.\
        \ Requires auth:user.write scope."
      operationId: auth__users__sessions__revoke
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Sessions revoked
      summary: Revoke all active sessions for an application user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - auth
      - users
      - sessions
      x-sdk-method-name: revoke
  /v1/_/console/config:
    get:
      description: "Returns active runtime console configuration settings including\
        \ session duration, MFA enforcement policy, and allowed origins. Requires\
        \ console:config.read scope."
      operationId: console__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Get dynamic runtime console configuration
      tags:
      - Config
      x-sdk-group-name:
      - console
      - config
      x-sdk-method-name: get
    put:
      description: "Mutates runtime console configuration parameters in console.config,\
        \ validating structure and applying settings dynamically across cluster nodes.\
        \ Requires console:config.write scope."
      operationId: console__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for console.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update dynamic runtime console configuration
      tags:
      - Config
      x-sdk-group-name:
      - console
      - config
      x-sdk-method-name: update
  /v1/_/console/users:
    get:
      description: "Returns all registered console user accounts from console.users\
        \ with email, active status, MFA enrollment status, last login timestamp,\
        \ and creation date. Requires console:user.read scope."
      operationId: console__users__list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
                default: null
          description: OK
      summary: List console user accounts
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: list
    post:
      description: Creates a new console user account in console.users with email
        and Argon2id password hash (minimum 8 characters). Publishes console.user.created
        event. Requires console:user.write scope.
      operationId: console__users__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateConsoleUserInput"
        description: Request body for console.CreateConsoleUserInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
      summary: Create console user account
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: create
  /v1/_/console/users/{user_id}:
    delete:
      description: "Permanently deletes console user account from console.users, automatically\
        \ cascading revocation of all active sessions in console.sessions. Emits console.user.deleted\
        \ event. Requires console:user.write scope."
      operationId: console__users__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: User deleted
      summary: Delete console user account and cascade sessions
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: delete
    get:
      description: "Retrieves a single console user account from console.users by\
        \ UUID, including email, enabled status, MFA enrollment flag, and timestamps.\
        \ Requires console:user.read scope."
      operationId: console__users__get
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Get console user account details by UUID
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: get
    put:
      description: "Modifies email or enabled status of a console user in console.users.\
        \ If account is disabled, immediately revokes all active sessions in console.sessions.\
        \ Emits console.user.updated event. Requires console:user.write scope."
      operationId: console__users__update
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateConsoleUserInput"
        description: Request body for console.UpdateConsoleUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Update console user account properties
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: update
  /v1/_/console/users/{user_id}/password:
    post:
      description: "Updates password hash in console.users using Argon2id key derivation\
        \ and revokes all active sessions in console.sessions, forcing re-login across\
        \ all devices. Emits console.user.password_reset event. Requires console:user.write\
        \ scope."
      operationId: console__users__reset_password
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ResetConsoleUserPasswordInput"
        description: Request body for console.ResetConsoleUserPasswordInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
      summary: Reset console user password and revoke sessions
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: reset_password
  /v1/_/console/users/{user_id}/sessions:
    get:
      description: "Returns all active sessions from console.sessions for the specified\
        \ console user, including client IP address, user-agent string, creation timestamp,\
        \ and expiration time. Requires console:user.read scope."
      operationId: console__users__sessions__list
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
                default: null
          description: OK
      summary: List active sessions for a console user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: list
  /v1/_/console/users/{user_id}/sessions/revoke:
    post:
      description: "Terminates all active sessions in console.sessions for the specified\
        \ console user, immediately invalidating cookie tokens. Emits console.user.sessions.revoked_all\
        \ event. Requires console:user.write scope."
      operationId: console__users__sessions__revoke
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Sessions revoked
      summary: Revoke all active sessions for a console user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: revoke
  /v1/_/console/users/{user_id}/sessions/{session_id}:
    delete:
      description: Terminates a single session by session UUID from console.sessions
        for the specified console user. Emits console.user.session.revoked event.
        Requires console:user.write scope.
      operationId: console__users__sessions__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Session revoked
      summary: Revoke a specific console user session
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: delete
  /v1/_/core/event-hooks:
    get:
      description: "Lists event hook subscriptions from core.event_hooks with driver\
        \ (sql or http), target function or URL, subscribed event type patterns, retry\
        \ limits, and enabled status. Requires core:event-hook.read scope."
      operationId: core__event_hooks__list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EventHook"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/EventHook"
                type: array
                default: null
          description: OK
      summary: List event hook subscriptions
      tags:
      - Event Hooks
      x-sdk-group-name:
      - core
      - event_hooks
      x-sdk-method-name: list
    post:
      description: "Creates an event hook subscription in core.event_hooks for SQL\
        \ stored procedures (sql driver) or HTTP webhooks (http driver) with HMAC-SHA256\
        \ signing secret encryption, wildcard event patterns, timeout guards, and\
        \ retry policies. Requires core:event-hook.write scope."
      operationId: core__event_hooks__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateEventHookInput"
        description: Request body for core.CreateEventHookInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHook"
            application/xml:
              schema:
                $ref: "#/components/schemas/EventHook"
          description: Created
      summary: Create an event hook subscription
      tags:
      - Event Hooks
      x-sdk-group-name:
      - core
      - event_hooks
      x-sdk-method-name: create
  /v1/_/core/event-hooks/{event_hook_id}:
    delete:
      description: "Permanently removes an event hook subscription from core.event_hooks,\
        \ immediately unbinding event dispatches. Delivery history is preserved or\
        \ cascaded according to retention rules. Requires core:event-hook.write scope."
      operationId: core__event_hooks__delete
      parameters:
      - explode: false
        in: path
        name: event_hook_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Event hook deleted
      summary: Delete event hook subscription
      tags:
      - Event Hooks
      x-sdk-group-name:
      - core
      - event_hooks
      x-sdk-method-name: delete
    get:
      description: "Retrieves event hook configuration by UUID from core.event_hooks,\
        \ including driver type, target endpoint, subscribed event patterns, retry\
        \ limits, and secret configuration indicator. Requires core:event-hook.read\
        \ scope."
      operationId: core__event_hooks__get
      parameters:
      - explode: false
        in: path
        name: event_hook_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHook"
            application/xml:
              schema:
                $ref: "#/components/schemas/EventHook"
          description: OK
      summary: Get event hook subscription details by UUID
      tags:
      - Event Hooks
      x-sdk-group-name:
      - core
      - event_hooks
      x-sdk-method-name: get
    put:
      description: "Modifies event hook parameters in core.event_hooks including target\
        \ URL or stored procedure, subscribed event patterns, retry count (0-10),\
        \ timeout (1-60s), signing secret, or enabled status. Requires core:event-hook.write\
        \ scope."
      operationId: core__event_hooks__update
      parameters:
      - explode: false
        in: path
        name: event_hook_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateEventHookInput"
        description: Request body for core.UpdateEventHookInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHook"
            application/xml:
              schema:
                $ref: "#/components/schemas/EventHook"
          description: OK
      summary: Update event hook subscription
      tags:
      - Event Hooks
      x-sdk-group-name:
      - core
      - event_hooks
      x-sdk-method-name: update
  /v1/_/core/event-hooks/{event_hook_id}/deliveries:
    get:
      description: "Queries the 100 most recent dispatch attempts for an event hook\
        \ from core.event_hook_deliveries, detailing event ID, payload, HTTP status\
        \ code, duration in milliseconds, error messages, and delivery state. Requires\
        \ core:event-hook.read scope."
      operationId: core__event_hooks__deliveries__list
      parameters:
      - explode: false
        in: path
        name: event_hook_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EventHookDelivery"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/EventHookDelivery"
                type: array
                default: null
          description: OK
      summary: List delivery audit logs for an event hook
      tags:
      - Event Hooks Deliveries
      x-sdk-group-name:
      - core
      - event_hooks
      - deliveries
      x-sdk-method-name: list
  /v1/_/core/event-hooks/{event_hook_id}/deliveries/{delivery_id}/retry:
    post:
      description: "Manually redrives an event hook delivery using the recorded event\
        \ payload, re-dispatching via the configured driver (SQL procedure or HTTP\
        \ POST webhook) and recording the new attempt outcome. Requires core:event-hook.write\
        \ scope."
      operationId: core__event_hooks__deliveries__retry
      parameters:
      - explode: false
        in: path
        name: event_hook_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: delivery_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHookDelivery"
            application/xml:
              schema:
                $ref: "#/components/schemas/EventHookDelivery"
          description: OK
      summary: Retry a past event hook delivery attempt
