          '*/*':
            schema:
              $ref: "#/components/schemas/CreateIndexInput"
        description: Request body for data.CreateIndexInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIndexResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/CreateIndexResponse"
          description: OK
      summary: Create an index on table columns
      tags:
      - Tables Indexes
      x-sdk-group-name:
      - data
      - tables
      - indexes
      x-sdk-method-name: create
  /v1/_/data/tables/{schema_name}/{table_name}/indexes/{index_name}:
    delete:
      description: "Executes DROP INDEX in PostgreSQL, removing the index and invalidating\
        \ query planner metadata. Emits data.table.updated event. Requires data:schema.write\
        \ scope."
      operationId: data__tables__indexes__delete
      parameters:
