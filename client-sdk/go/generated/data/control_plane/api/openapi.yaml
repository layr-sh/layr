openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/_/data/cache/flush:
    post:
      description: "Flushes in-memory and distributed table reflection metadata, query\
        \ result caches, and composite version counters across all cluster nodes.\
        \ Requires data:cache.write scope."
      operationId: data__cache__flush
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlushCacheResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/FlushCacheResponse"
          description: OK
      summary: Flush all global query and schema reflection caches
      tags:
      - Cache
      x-sdk-group-name:
      - data
      - cache
      x-sdk-method-name: flush
  /v1/_/data/cache/invalidate:
    post:
      description: "Invalidates schema reflection and query caches for a specific\
        \ schema, table name, or pattern, bumping composite table cache versions.\
        \ Requires data:cache.write scope."
      operationId: data__cache__invalidate
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/InvalidateCacheInput"
        description: Request body for data.InvalidateCacheInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidateCacheResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/InvalidateCacheResponse"
          description: OK
      summary: Invalidate specific table or catalog caches
      tags:
      - Cache
      x-sdk-group-name:
      - data
      - cache
      x-sdk-method-name: invalidate
  /v1/_/data/config:
    get:
      description: "Returns dynamic data service configuration settings including\
        \ exposed schema names, connection pool sizes, REST limit defaults, and cache\
        \ TTL parameters. Requires data:config.read scope."
      operationId: data__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Retrieve dynamic data service configuration
      tags:
      - Config
      x-sdk-group-name:
      - data
      - config
      x-sdk-method-name: get
    put:
      description: "Updates operational data service parameters in data.config, dynamically\
        \ tuning connection limits, exposed schemas, and cache behaviors without server\
        \ downtime. Requires data:config.write scope."
      operationId: data__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for data.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update dynamic data service configuration
      tags:
      - Config
      x-sdk-group-name:
      - data
      - config
      x-sdk-method-name: update
  /v1/_/data/tables:
    get:
      description: "Queries PostgreSQL information_schema and pg_catalog to return\
        \ tables, primary key column names, approximate row counts, and RLS enabled\
        \ statuses across exposed schemas. Requires data:schema.read scope."
      operationId: data__tables__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTablesResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListTablesResponse"
          description: OK
      summary: List all database tables across configured schemas
      tags:
      - Tables
      x-sdk-group-name:
      - data
      - tables
      x-sdk-method-name: list
    post:
      description: "Executes DDL to provision a table adhering to Layr conventions\
        \ (UUIDv7 primary keys, created_at, and last_updated_at timestamps), invalidating\
        \ catalog caches and emitting data.table.created event. Requires data:schema.write\
        \ scope."
      operationId: data__tables__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateTableInput"
        description: Request body for data.CreateTableInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
          description: Created
      summary: Create a new PostgreSQL table with UUIDv7 primary key
      tags:
      - Tables
      x-sdk-group-name:
      - data
      - tables
      x-sdk-method-name: create
  /v1/_/data/tables/{schema_name}/{table_name}:
    delete:
      description: "Executes DROP TABLE CASCADE in PostgreSQL, removing the table,\
        \ associated indexes, triggers, and foreign key constraints. Invalidates catalog\
        \ caches and emits data.table.deleted event. Requires data:schema.write scope."
      operationId: data__tables__delete
      parameters:
      - description: Cascade table drop to dependent constraints and views
        explode: true
        in: query
        name: cascade
        required: false
        schema:
          type: boolean
        style: form
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTableResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/DeleteTableResponse"
          description: OK
      summary: Drop a table and cascade constraints
      tags:
      - Tables
      x-sdk-group-name:
      - data
      - tables
      x-sdk-method-name: delete
    get:
      description: "Retrieves complete architectural schema for a table, detailing\
        \ columns (types, nullability, defaults), primary/foreign key constraints,\
        \ indexes, and active RLS policies. Requires data:schema.read scope."
      operationId: data__tables__get
      parameters:
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
            application/xml:
              schema:
                $ref: "#/components/schemas/Table"
          description: OK
      summary: "Inspect table schema, columns, indexes, and constraints"
      tags:
      - Tables
      x-sdk-group-name:
      - data
      - tables
      x-sdk-method-name: get
  /v1/_/data/tables/{schema_name}/{table_name}/columns:
    post:
      description: "Executes ALTER TABLE ADD COLUMN with validated PostgreSQL data\
        \ type, nullability constraint, and optional default expression. Invalidates\
        \ schema reflection caches and emits data.table.updated event. Requires data:schema.write\
        \ scope."
      operationId: data__tables__columns__create
      parameters:
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
