        catalog_ttl_seconds:
          type: integer
        enabled:
          type: boolean
        invalidate_on_cdc:
          type: boolean
        invalidate_on_mutation:
          type: boolean
        max_cached_queries:
          type: integer
        query_ttl_seconds:
          type: integer
      required:
      - catalog_ttl_seconds
      - enabled
      - invalidate_on_cdc
      - invalidate_on_mutation
      - max_cached_queries
      - query_ttl_seconds
    Column:
