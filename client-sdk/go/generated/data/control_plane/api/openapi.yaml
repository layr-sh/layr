      x-sdk-group-name:
      - data
      - tables
      - rls
      x-sdk-method-name: update
components:
  schemas:
    CORSConfig:
      example:
        allowed_headers:
        - allowed_headers
        - allowed_headers
        allowed_origins:
        - allowed_origins
        - allowed_origins
      properties:
        allowed_headers:
          items:
            type: string
          nullable: true
          type: array
          default: null
        allowed_origins:
          items:
            type: string
          nullable: true
          type: array
          default: null
      required:
