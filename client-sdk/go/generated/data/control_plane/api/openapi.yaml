            application/json:
              schema:
                $ref: "#/components/schemas/CreatePolicyResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/CreatePolicyResponse"
          description: OK
      summary: Create a Row-Level Security policy on a table
      tags:
      - Tables Policies
      x-sdk-group-name:
      - data
      - tables
      - policies
      x-sdk-method-name: create
  /v1/_/data/tables/{schema_name}/{table_name}/policies/{policy_name}:
    delete:
      description: "Executes DROP POLICY on the specified table, removing the security\
