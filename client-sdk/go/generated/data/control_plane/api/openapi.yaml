        description: Request body for data.Column
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateColumnResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/CreateColumnResponse"
          description: OK
      summary: Add a new column to a table schema
      tags:
      - Tables Columns
      x-sdk-group-name:
      - data
      - tables
      - columns
      x-sdk-method-name: create
  /v1/_/data/tables/{schema_name}/{table_name}/columns/{column_name}:
    delete:
      description: "Executes ALTER TABLE DROP COLUMN CASCADE, dropping the column\
        \ and dependent views or indexes. Invalidates reflection caches and emits\
        \ data.table.updated event. Requires data:schema.write scope."
      operationId: data__tables__columns__delete
      parameters:
      - description: Cascade column drop to dependent views or indexes
        explode: true
        in: query
        name: cascade
        required: false
        schema:
          type: boolean
        style: form
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: column_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteColumnResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/DeleteColumnResponse"
          description: OK
      summary: Drop a column from a table schema
      tags:
      - Tables Columns
      x-sdk-group-name:
      - data
      - tables
      - columns
      x-sdk-method-name: delete
    patch:
      description: "Alters column attributes (data type conversion, set/drop default,\
        \ set/drop NOT NULL) or renames the column. Invalidates table metadata caches\
        \ and emits data.table.updated event. Requires data:schema.write scope."
      operationId: data__tables__columns__update
      parameters:
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: column_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateColumnInput"
        description: Request body for data.UpdateColumnInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateColumnResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/UpdateColumnResponse"
          description: OK
      summary: "Alter column type, default, nullability, or rename"
      tags:
      - Tables Columns
      x-sdk-group-name:
      - data
      - tables
      - columns
      x-sdk-method-name: update
  /v1/_/data/tables/{schema_name}/{table_name}/indexes:
    get:
      description: "Queries pg_indexes to return all index definitions, methods, uniqueness\
