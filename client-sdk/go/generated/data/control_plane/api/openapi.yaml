        default_value: default_value
        is_nullable: true
        is_primary_key: true
        is_unique: true
        name: name
        type: type
      properties:
        default_value:
          type: string
          nullable: true
        is_nullable:
          type: boolean
        is_primary_key:
          type: boolean
        is_unique:
          type: boolean
        name:
          type: string
        type:
          type: string
      required:
      - is_nullable
      - is_primary_key
      - is_unique
      - name
      - type
    Config:
      description: Config schema
      example:
        cache:
          catalog_ttl_seconds: 0
          enabled: true
          invalidate_on_cdc: true
          invalidate_on_mutation: true
          max_cached_queries: 6
          query_ttl_seconds: 1
        cors:
          allowed_headers:
          - allowed_headers
          - allowed_headers
          allowed_origins:
          - allowed_origins
          - allowed_origins
        graphql:
