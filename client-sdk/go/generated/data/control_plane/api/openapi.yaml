        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIndexesResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListIndexesResponse"
          description: OK
      summary: List indexes defined on a table
      tags:
      - Tables Indexes
      x-sdk-group-name:
      - data
      - tables
      - indexes
      x-sdk-method-name: list
    post:
      description: "Executes CREATE INDEX supporting B-Tree, GIN, GiST, or BRIN index\
        \ methods, unique constraints, and multi-column expressions. Emits data.table.updated\
        \ event. Requires data:schema.write scope."
      operationId: data__tables__indexes__create
      parameters:
      - explode: false
        in: path
