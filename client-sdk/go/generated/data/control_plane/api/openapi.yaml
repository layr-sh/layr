        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: index_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteIndexResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/DeleteIndexResponse"
          description: OK
      summary: Drop an index from a table
      tags:
      - Tables Indexes
      x-sdk-group-name:
      - data
      - tables
      - indexes
      x-sdk-method-name: delete
  /v1/_/data/tables/{schema_name}/{table_name}/policies:
    get:
      description: "Queries pg_policies to list active Row-Level Security (RLS) policies,\
        \ detailing command targets (SELECT, INSERT, UPDATE, DELETE), roles, USING\
        \ filters, and WITH CHECK expressions. Requires data:schema.read scope."
      operationId: data__tables__policies__list
      parameters:
      - explode: false
        in: path
        name: schema_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: table_name
        required: true
