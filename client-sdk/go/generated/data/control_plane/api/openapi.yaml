      - policies
      x-sdk-method-name: list
    post:
      description: "Executes CREATE POLICY in PostgreSQL, attaching declarative row-level\
        \ access control rules for specific database roles and SQL commands with USING\
        \ and WITH CHECK expressions. Emits data.table.updated event. Requires data:schema.write\
