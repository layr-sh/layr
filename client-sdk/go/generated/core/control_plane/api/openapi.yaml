            type: string
          nullable: true
          type: array
          default: null
        console_user_id:
          type: string
          nullable: true
        created_at:
          format: date-time
          type: string
        description:
          type: string
          nullable: true
        expires_at:
          format: date-time
          type: string
          nullable: true
        id:
          type: string
        is_enabled:
          type: boolean
        key_prefix:
          type: string
        last_updated_at:
          format: date-time
          type: string
        last_used_at:
          format: date-time
          type: string
          nullable: true
        name:
          type: string
        scopes:
          items:
            type: string
          nullable: true
          type: array
          default: null
        secret_key:
          type: string
      required:
      - created_at
      - id
      - is_enabled
      - key_prefix
      - last_updated_at
      - name
      - scopes
      - secret_key
    Empty:
      description: Empty schema
    Event:
      example:
        action: action
        actor:
          id: ""
          role: role
          type: type
        context:
          ip_address: ip_address
          request_id: request_id
          user_agent: user_agent
        created_at: 2000-01-23T04:56:07.000+00:00
        data:
          key: ""
        id: ""
        metadata:
          key: ""
        resource_id: resource_id
        resource_type: resource_type
        type: type
