        error_message:
          type: string
          nullable: true
        event_hook_id: {}
        event_id: {}
        event_type:
          type: string
        http_response_status:
          type: integer
          nullable: true
        id: {}
        is_delivered:
          type: boolean
        payload: {}
        result:
          type: string
          nullable: true
      required:
      - attempt_count
      - created_at
      - duration_ms
      - event_hook_id
      - event_id
      - event_type
      - id
      - is_delivered
      - payload
    ListEventsResponse:
      description: ListEventsResponse schema
      example:
        count: 0
        data:
        - action: action
          actor:
            id: ""
            role: role
            type: type
          context:
            ip_address: ip_address
            request_id: request_id
            user_agent: user_agent
          created_at: 2000-01-23T04:56:07.000+00:00
          data:
            key: ""
          id: ""
          metadata:
            key: ""
          resource_id: resource_id
          resource_type: resource_type
          type: type
        - action: action
          actor:
            id: ""
            role: role
            type: type
          context:
            ip_address: ip_address
            request_id: request_id
            user_agent: user_agent
          created_at: 2000-01-23T04:56:07.000+00:00
          data:
            key: ""
          id: ""
          metadata:
            key: ""
          resource_id: resource_id
          resource_type: resource_type
          type: type
        limit: 6
        offset: 1
        total: 5
      properties:
        count:
          type: integer
        data:
          items:
            $ref: "#/components/schemas/Event"
          nullable: true
          type: array
          default: null
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
      - count
      - data
      - limit
      - offset
    ServiceAccount:
      description: ServiceAccount schema
      example:
        allowed_ips:
        - allowed_ips
        - allowed_ips
        console_user_id: console_user_id
        created_at: 2000-01-23T04:56:07.000+00:00
        description: description
        expires_at: 2000-01-23T04:56:07.000+00:00
        id: id
        is_enabled: true
