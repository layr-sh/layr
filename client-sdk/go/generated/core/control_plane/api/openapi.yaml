          type: string
      required:
      - type
    EventContext:
      example:
        ip_address: ip_address
        request_id: request_id
        user_agent: user_agent
      properties:
        ip_address:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
    EventHook:
      description: EventHook schema
      example:
        created_at: 2000-01-23T04:56:07.000+00:00
        driver: driver
        event_types:
        - event_types
        - event_types
        http_target_url: http_target_url
        id: ""
        is_enabled: true
        last_updated_at: 2000-01-23T04:56:07.000+00:00
        max_retries: 0
        name: name
        signing_secret_configured: true
        sql_function_name: sql_function_name
