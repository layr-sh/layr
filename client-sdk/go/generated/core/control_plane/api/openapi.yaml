        action:
          type: string
        actor:
          $ref: "#/components/schemas/EventActor"
        context:
          $ref: "#/components/schemas/EventContext"
        created_at:
          format: date-time
          type: string
        data:
          additionalProperties:
            nullable: true
          nullable: true
          type: object
        id: {}
        metadata:
          additionalProperties:
            nullable: true
          nullable: true
          type: object
        resource_id:
          type: string
          nullable: true
        resource_type:
          type: string
        type:
          type: string
      required:
      - action
      - actor
      - context
      - created_at
      - data
      - id
      - metadata
      - resource_type
      - type
    EventActor:
      example:
