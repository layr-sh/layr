openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/_/function/config:
    get:
      description: "Returns operational function runtime settings including default\
        \ isolate timeouts, memory limits, runner concurrency, and isolate pool capacities.\
        \ Requires function:config.read scope."
      operationId: function__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Get runtime function configuration
      tags:
      - Config
      x-sdk-group-name:
      - function
      - config
      x-sdk-method-name: get
    put:
      description: "Modifies operational function runtime settings in function.config,\
        \ tuning concurrency limits, memory caps, and execution timeouts without restarting\
        \ the gateway. Requires function:config.write scope."
      operationId: function__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for function.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update runtime function configuration
      tags:
      - Config
      x-sdk-group-name:
      - function
      - config
      x-sdk-method-name: update
  /v1/_/function/domains:
    get:
      description: Returns all registered custom domain definitions from function.custom_domains
        with hostnames and verification states. Requires function:endpoint.read scope.
      operationId: function__domains__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCustomDomainsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListCustomDomainsResponse"
          description: OK
      summary: List registered custom domains
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: list
    post:
      description: Registers a standalone custom domain hostname in function.custom_domains
        with verification status and TLS configuration. Emits function.domain.created
        event. Requires function:endpoint.write scope.
      operationId: function__domains__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateCustomDomainInput"
        description: Request body for function.CreateCustomDomainInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"
            application/xml:
              schema:
                $ref: "#/components/schemas/CustomDomain"
          description: Created
      summary: Register a standalone custom domain
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: create
  /v1/_/function/domains/{domain_id}:
    delete:
      description: "Deletes a custom domain from function.custom_domains, cascading\
        \ removal of all attached endpoint route mappings. Emits function.domain.deleted\
        \ event. Requires function:endpoint.write scope."
      operationId: function__domains__delete
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Custom domain deleted
      summary: Delete custom domain and cascade attached routes
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: delete
    get:
      description: "Returns a single custom domain definition by UUID from function.custom_domains\
        \ including verification status, TLS configuration, and DNS setup instructions.\
        \ Requires function:endpoint.read scope."
      operationId: function__domains__get
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"
            application/xml:
              schema:
                $ref: "#/components/schemas/CustomDomain"
          description: OK
      summary: Get custom domain details and DNS instructions
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: get
    patch:
      description: "Updates custom domain configuration such as toggling TLS on or\
        \ off, or updating ACME contact email at runtime. Requires function:endpoint.write\
        \ scope."
      operationId: function__domains__update
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateCustomDomainInput"
        description: Request body for function.UpdateCustomDomainInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"
            application/xml:
              schema:
                $ref: "#/components/schemas/CustomDomain"
          description: OK
      summary: Update custom domain configuration
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: update
  /v1/_/function/domains/{domain_id}/verify:
    post:
      description: "Performs a live DNS lookup (CNAME/IP) to verify domain DNS points\
        \ to Layr ingress. If matched, activates domain status and triggers TLS provisioning\
        \ when enabled. If not matched, returns misconfigured status with diagnostic\
        \ error details. Requires function:endpoint.write scope."
      operationId: function__domains__verify
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"
            application/xml:
              schema:
                $ref: "#/components/schemas/CustomDomain"
          description: OK
      summary: Verify custom domain DNS configuration
      tags:
      - Domains
      x-sdk-group-name:
      - function
      - domains
      x-sdk-method-name: verify
  /v1/_/function/endpoints:
    get:
      description: "Returns all registered serverless endpoints from function.endpoints\
        \ with route names, runtime engines, timeout guards, memory limits, active\
        \ deployment IDs, and status. Requires function:endpoint.read scope."
      operationId: function__endpoints__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEndpointsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListEndpointsResponse"
          description: OK
      summary: List all registered serverless endpoints
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: list
    post:
      description: "Provisions a new serverless endpoint definition in function.endpoints\
        \ with route path, name, runtime environment (Node, Deno, Python, Go), timeout\
        \ guards, memory limits, and environment variables. Emits function.endpoint.created\
        \ event. Requires function:endpoint.write scope."
      operationId: function__endpoints__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateEndpointInput"
        description: Request body for function.CreateEndpointInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
            application/xml:
              schema:
                $ref: "#/components/schemas/Endpoint"
          description: Created
      summary: Register a new serverless endpoint
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: create
  /v1/_/function/endpoints/{endpoint_id}:
    delete:
      description: "Permanently deletes an endpoint from function.endpoints, unloads\
        \ running worker isolates, cascades historical deployments, and removes custom\
        \ domain routes. Emits function.endpoint.deleted event. Requires function:endpoint.write\
        \ scope."
      operationId: function__endpoints__delete
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Endpoint deleted
      summary: Delete serverless endpoint and unload runtime isolates
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: delete
    get:
      description: "Retrieves complete definition of a serverless endpoint from function.endpoints\
        \ by ID or name, including runtime configuration, environment variables, and\
        \ active deployment version. Requires function:endpoint.read scope."
      operationId: function__endpoints__get
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
            application/xml:
              schema:
                $ref: "#/components/schemas/Endpoint"
          description: OK
      summary: Get serverless endpoint definition by ID
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: get
    put:
      description: "Modifies an existing serverless endpoint definition in function.endpoints,\
        \ updating environment variables, timeout guards, or memory limits. Emits\
        \ function.endpoint.updated event. Requires function:endpoint.write scope."
      operationId: function__endpoints__update
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateEndpointInput"
        description: Request body for function.UpdateEndpointInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
            application/xml:
              schema:
                $ref: "#/components/schemas/Endpoint"
          description: OK
      summary: Update serverless endpoint definition
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: update
  /v1/_/function/endpoints/{endpoint_id}/deploy:
    post:
      description: "Uploads and registers an immutable code bundle in function.deployments,\
        \ increments revision version, sets it as the active deployment pointer, and\
        \ immediately hot-reloads runtime worker isolates. Emits function.deployment.created\
        \ event. Requires function:endpoint.deploy scope."
      operationId: function__deployments__create
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateDeploymentInput"
        description: Request body for function.CreateDeploymentInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
            application/xml:
              schema:
                $ref: "#/components/schemas/Deployment"
          description: Created
      summary: Create immutable deployment and hot-reload runner
      tags:
      - Deployments
      x-sdk-group-name:
      - function
      - deployments
      x-sdk-method-name: create
  /v1/_/function/endpoints/{endpoint_id}/deployments:
    get:
      description: "Returns version history of immutable code deployments for an endpoint\
        \ from function.deployments, detailing revision numbers, creation timestamps,\
        \ and active flags. Requires function:endpoint.read scope."
      operationId: function__deployments__list
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeploymentsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListDeploymentsResponse"
          description: OK
      summary: List immutable deployments for an endpoint
      tags:
      - Deployments
      x-sdk-group-name:
      - function
      - deployments
      x-sdk-method-name: list
  /v1/_/function/endpoints/{endpoint_id}/domains:
    get:
      description: Returns all custom domain route mappings from function.custom_domain_routes
        configured for a specific serverless endpoint. Requires function:endpoint.read
        scope.
      operationId: function__endpoint_domains__list
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCustomDomainRoutesResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListCustomDomainRoutesResponse"
          description: OK
      summary: List custom domain routes attached to an endpoint
      tags:
      - Endpoint Domains
      x-sdk-group-name:
      - function
      - endpoint_domains
      x-sdk-method-name: list
    post:
      description: "Maps a custom domain hostname and URL path prefix to a specific\
        \ serverless endpoint in function.custom_domain_routes, enabling custom domain\
        \ routing. Requires function:endpoint.write scope."
      operationId: function__endpoint_domains__create
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateCustomDomainRouteInput"
        description: Request body for function.CreateCustomDomainRouteInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomainRoute"
            application/xml:
              schema:
                $ref: "#/components/schemas/CustomDomainRoute"
          description: Created
      summary: Attach endpoint route to custom domain with path prefix
      tags:
      - Endpoint Domains
      x-sdk-group-name:
      - function
      - endpoint_domains
      x-sdk-method-name: create
  /v1/_/function/endpoints/{endpoint_id}/domains/{route_id}:
    delete:
      description: "Removes a specific domain route mapping from function.custom_domain_routes,\
        \ unbinding the custom path prefix from the endpoint. Requires function:endpoint.write\
        \ scope."
      operationId: function__endpoint_domains__delete
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: route_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Custom domain route deleted
      summary: Remove endpoint route mapping from custom domain
      tags:
      - Endpoint Domains
      x-sdk-group-name:
      - function
      - endpoint_domains
      x-sdk-method-name: delete
  /v1/_/function/endpoints/{endpoint_id}/executions:
    get:
      description: "Returns historical invocation audit records from function.executions\
        \ for a specific endpoint, detailing response codes, durations, memory usage,\
        \ and execution log streams. Requires function:endpoint.read scope."
      operationId: function__endpoints__executions
      parameters:
      - description: "Maximum number of items to return (default 50, maximum 1000)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: Number of items to skip before returning results (default 0)
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListExecutionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListExecutionsResponse"
          description: OK
      summary: Query execution history logs for a specific endpoint
      tags:
      - Endpoints
      x-sdk-group-name:
      - function
      - endpoints
      x-sdk-method-name: executions
  /v1/_/function/endpoints/{endpoint_id}/rollback:
    post:
      description: "Atomically updates the active deployment pointer in function.endpoints\
        \ to an earlier immutable deployment version, instantly hot-reloading runtime\
        \ runner isolates. Emits function.deployment.rollback event. Requires function:endpoint.deploy\
        \ scope."
      operationId: function__deployments__rollback
      parameters:
      - explode: false
        in: path
        name: endpoint_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/RollbackDeploymentInput"
        description: Request body for function.RollbackDeploymentInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
            application/xml:
              schema:
                $ref: "#/components/schemas/Deployment"
          description: OK
      summary: Rollback endpoint to a previous deployment revision
      tags:
      - Deployments
      x-sdk-group-name:
      - function
      - deployments
      x-sdk-method-name: rollback
  /v1/_/function/executions:
    get:
      description: "Queries execution telemetry logs from function.executions across\
        \ all endpoints, returning status codes, execution duration in milliseconds,\
        \ memory utilization, and stdout/stderr streams. Requires function:endpoint.read\
        \ scope."
      operationId: function__executions__list
      parameters:
      - description: "Maximum number of items to return (default 50, maximum 1000)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: Number of items to skip before returning results (default 0)
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Filter executions by endpoint UUID
        explode: true
        in: query
        name: endpoint_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListExecutionsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListExecutionsResponse"
          description: OK
      summary: Query execution history logs across all endpoints
      tags:
      - Executions
      x-sdk-group-name:
      - function
      - executions
      x-sdk-method-name: list
  /v1/_/function/stats:
    get:
      description: "Returns runtime health, endpoint and deployment counts, stored\
        \ bundle payload bytes, domain and TLS status counts, retained execution totals,\
        \ and execution counts, failures, and average/P95 latency over a rolling 24-hour\
        \ window. Includes per-endpoint window usage. Failures include HTTP 4xx/5xx\
        \ responses or recorded execution errors. Metrics reflect retained logs, not\
        \ lifetime traffic. Requires function:stats.read scope."
      operationId: function__stats__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetStatsResponse"
          description: OK
      summary: Get function runtime telemetry and worker statistics
      tags:
      - Stats
      x-sdk-group-name:
      - function
      - stats
      x-sdk-method-name: get
components:
  schemas:
    Config:
      description: Config schema
      example:
        allowed_environment_keys:
        - allowed_environment_keys
        - allowed_environment_keys
        custom_domain_apex_ip: custom_domain_apex_ip
        custom_domain_cname_target: custom_domain_cname_target
        default_memory_limit_mb: 0
        default_runtime: default_runtime
        default_timeout_seconds: 6
        default_tls_acme_email: default_tls_acme_email
        max_bundle_size_bytes: 1
        workerd_runtime:
          compatibility_date: compatibility_date
          compatibility_flags:
          - compatibility_flags
          - compatibility_flags
      properties:
        allowed_environment_keys:
          items:
            type: string
          nullable: true
          type: array
          default: null
        custom_domain_apex_ip:
          type: string
        custom_domain_cname_target:
          type: string
        default_memory_limit_mb:
          type: integer
        default_runtime:
          type: string
        default_timeout_seconds:
          type: integer
        default_tls_acme_email:
          type: string
        max_bundle_size_bytes:
          format: int64
          type: integer
        workerd_runtime:
          $ref: "#/components/schemas/WorkerdRuntimeConfig"
      required:
      - allowed_environment_keys
      - default_memory_limit_mb
      - default_runtime
      - default_timeout_seconds
      - max_bundle_size_bytes
      - workerd_runtime
    CreateCustomDomainInput:
      description: CreateCustomDomainInput schema
      example:
