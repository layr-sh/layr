    post:
      description: "Probes and extracts dimensions, format, file size, colorspace,\
        \ and EXIF metadata from an uploaded image binary payload."
      operationId: image__info__post
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInfoResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetInfoResponse"
          description: OK
      summary: Inspect image metadata from binary upload
      tags:
      - Info
      x-sdk-group-name:
      - image
      - info
      x-sdk-method-name: post
  /v1/image/info/{signature}/{path...}:
    get:
      description: "Extracts structural metadata (width, height, format, file size,\
        \ colorspace, EXIF, orientation) from a remote or storage image path using\
        \ cryptographic signature verification."
