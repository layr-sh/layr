openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/_/image/config:
    get:
      description: "Returns operational image service settings including compression\
        \ quality defaults, maximum resolution limits, allowed source domains, and\
        \ signature enforcement policy. Requires image:config.read scope."
      operationId: image__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Get runtime image service configuration
      tags:
      - Config
      x-sdk-group-name:
      - image
      - config
      x-sdk-method-name: get
    put:
      description: "Modifies operational image service parameters in image.config,\
        \ updating compression quality, resolution limits, and domain allowlists without\
        \ restarting the service. Requires image:config.write scope."
      operationId: image__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for image.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update runtime image service configuration
      tags:
      - Config
      x-sdk-group-name:
      - image
      - config
      x-sdk-method-name: update
  /v1/_/image/presets:
    get:
      description: "Returns all configured transformation presets from image.presets\
        \ with preset names, processing option strings, and creation timestamps. Requires\
        \ image:preset.read scope."
      operationId: image__presets__list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPresetsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ListPresetsResponse"
          description: OK
      summary: List configured image transformation presets
      tags:
      - Presets
      x-sdk-group-name:
      - image
      - presets
      x-sdk-method-name: list
    post:
      description: "Creates a new transformation preset in image.presets defining\
        \ reusable imgproxy processing options (dimensions, crop mode, quality, format).\
        \ Emits image.preset.created event. Requires image:preset.write scope."
      operationId: image__presets__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreatePresetInput"
        description: Request body for image.CreatePresetInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
            application/xml:
              schema:
                $ref: "#/components/schemas/Preset"
          description: Created
      summary: Create a named image transformation preset
      tags:
      - Presets
      x-sdk-group-name:
      - image
      - presets
      x-sdk-method-name: create
  /v1/_/image/presets/{preset_id}:
    delete:
      description: Deletes a transformation preset by ID from image.presets. Emits
        image.preset.deleted event. Requires image:preset.write scope.
      operationId: image__presets__delete
      parameters:
      - explode: false
        in: path
        name: preset_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Preset deleted
      summary: Delete an image transformation preset
      tags:
      - Presets
      x-sdk-group-name:
      - image
      - presets
      x-sdk-method-name: delete
    get:
      description: Retrieves a single transformation preset definition by ID from
        image.presets. Requires image:preset.read scope.
      operationId: image__presets__get
      parameters:
      - explode: false
        in: path
        name: preset_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
            application/xml:
              schema:
                $ref: "#/components/schemas/Preset"
          description: OK
      summary: Get image transformation preset by ID
      tags:
      - Presets
      x-sdk-group-name:
      - image
      - presets
      x-sdk-method-name: get
    put:
      description: Modifies the transformation options or friendly name of an existing
        preset in image.presets. Emits image.preset.updated event. Requires image:preset.write
        scope.
      operationId: image__presets__update
      parameters:
      - explode: false
        in: path
        name: preset_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdatePresetInput"
        description: Request body for image.UpdatePresetInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
            application/xml:
              schema:
                $ref: "#/components/schemas/Preset"
          description: OK
      summary: Update an image transformation preset
      tags:
      - Presets
      x-sdk-group-name:
      - image
      - presets
      x-sdk-method-name: update
  /v1/_/image/stats:
    get:
      description: "Returns real-time operational statistics including image cache\
        \ hit ratios, processing latency, memory usage, and transformation throughput.\
        \ Requires image:stats.read scope."
      operationId: image__stats__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatsResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/GetStatsResponse"
          description: OK
      summary: Get image service telemetry statistics
      tags:
      - Stats
      x-sdk-group-name:
      - image
      - stats
      x-sdk-method-name: get
  /v1/_/image/url/sign:
    post:
      description: Generates a cryptographically signed HMAC-SHA256 signature and
        URL path for an image transformation request using the master image key. Requires
        image:sign.write scope.
      operationId: image__url__sign
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/SignURLInput"
        description: Request body for image.SignURLInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignURLResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/SignURLResponse"
          description: OK
      summary: Generate a cryptographically signed image URL
      tags:
      - URLs
      x-sdk-group-name:
      - image
      - url
      x-sdk-method-name: sign
