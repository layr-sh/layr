openapi: 3.1.0
info:
  description: "\nThis is the autogenerated OpenAPI documentation for your [Fuego](https://github.com/go-fuego/fuego)\
    \ API.\n\nBelow is a Fuego Cheatsheet to help you get started. Don't hesitate\
    \ to check the [Fuego documentation](https://go-fuego.dev) for more details.\n\
    \nHappy coding! 🔥\n\n## Usage\n\n### Route registration\n\n```go\nfunc main()\
    \ {\n\t// Create a new server\n\ts := fuego.NewServer()\n\n\t// Register some\
    \ routes\n\tfuego.Post(s, \"/hello\", myController)\n\tfuego.Get(s, \"/myPath\"\
    , otherController)\n\tfuego.Put(s, \"/hello\", thirdController)\n\n\tadminRoutes\
    \ := fuego.Group(s, \"/admin\")\n\tfuego.Use(adminRoutes, myMiddleware) // This\
    \ middleware (for authentication, etc...) will be available for routes starting\
    \ by /admin/*, \n\tfuego.Get(adminRoutes, \"/hello\", groupController) // This\
    \ route will be available at /admin/hello\n\n\t// Start the server\n\ts.Start()\n\
    }\n```\n\n### Basic controller\n\n```go\ntype MyBody struct {\n\tName string `json:\"\
    name\" validate:\"required,max=30\"`\n}\n\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc hello(ctx fuego.ContextWithBody[MyBody])\
    \ (*MyResponse, error) {\n\tbody, err := ctx.Body()\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\treturn &MyResponse{Answer: \"Hello \" + body.Name}, nil\n\
    }\n```\n\n### Add openAPI information to the route\n\n```go\nimport (\n\t\"github.com/go-fuego/fuego\"\
    \n\t\"github.com/go-fuego/fuego/option\"\n\t\"github.com/go-fuego/fuego/param\"\
    \n)\n\nfunc main() {\n\ts := fuego.NewServer()\n\n\t// Custom OpenAPI options\n\
    \tfuego.Post(s, \"/\", myController\n\t\toption.Description(\"This route does\
    \ something...\"),\n\t\toption.Summary(\"This is my summary\"),\n\t\toption.Tags(\"\
    MyTag\"), // A tag is set by default according to the return type (can be deactivated)\n\
    \t\toption.Deprecated(), // Marks the route as deprecated in the OpenAPI spec\n\
    \n\t\toption.Query(\"name\", \"Declares a query parameter with default value\"\
    , param.Default(\"Carmack\")),\n\t\toption.Header(\"Authorization\", \"Bearer\
    \ token\", param.Required()),\n\t\toptionPagination,\n\t\toptionCustomBehavior,\n\
    \t)\n\n\ts.Run()\n}\n\nvar optionPagination = option.Group(\n\toption.QueryInt(\"\
    page\", \"Page number\", param.Default(1), param.Example(\"1st page\", 1), param.Example(\"\
    42nd page\", 42)),\n\toption.QueryInt(\"perPage\", \"Number of items per page\"\
    ),\n)\n\nvar optionCustomBehavior = func(r *fuego.BaseRoute) {\n\tr.XXX = \"YYY\"\
    \n}\n```\n\nThen, in the controller\n\n```go\ntype MyResponse struct {\n\tAnswer\
    \ string `json:\"answer\"`\n}\n\nfunc getAllPets(ctx fuego.ContextNoBody) (*MyResponse,\
    \ error) {\n\tname := ctx.QueryParam(\"name\")\n\tperPage, _ := ctx.QueryParamIntErr(\"\
    per_page\")\n\n\treturn &MyResponse{Answer: \"Hello \" + name}, nil\n}\n```\n"
  title: OpenAPI
  version: 0.0.1
servers:
- url: /
paths:
  /v1/_/console/config:
    get:
      description: "Returns active runtime console configuration settings including\
        \ session duration, MFA enforcement policy, and allowed origins. Requires\
        \ console:config.read scope."
      operationId: console__config__get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Get dynamic runtime console configuration
      tags:
      - Config
      x-sdk-group-name:
      - console
      - config
      x-sdk-method-name: get
    put:
      description: "Mutates runtime console configuration parameters in console.config,\
        \ validating structure and applying settings dynamically across cluster nodes.\
        \ Requires console:config.write scope."
      operationId: console__config__update
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Config"
        description: Request body for console.Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/xml:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
      summary: Update dynamic runtime console configuration
      tags:
      - Config
      x-sdk-group-name:
      - console
      - config
      x-sdk-method-name: update
  /v1/_/console/users:
    get:
      description: "Returns all registered console user accounts from console.users\
        \ with email, active status, MFA enrollment status, last signed in timestamp,\
        \ and creation date. Requires console:user.read scope."
      operationId: console__users__list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
                default: null
          description: OK
      summary: List console user accounts
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: list
    post:
      description: Creates a new console user account in console.users with email
        and Argon2id password hash (minimum 8 characters). Publishes console.user.created
        event. Requires console:user.write scope.
      operationId: console__users__create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CreateConsoleUserInput"
        description: Request body for console.CreateConsoleUserInput
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
      summary: Create console user account
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: create
  /v1/_/console/users/{user_id}:
    delete:
      description: "Permanently deletes console user account from console.users, automatically\
        \ cascading revocation of all active sessions in console.sessions. Emits console.user.deleted\
        \ event. Requires console:user.write scope."
      operationId: console__users__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: User deleted
      summary: Delete console user account and cascade sessions
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: delete
    get:
      description: "Retrieves a single console user account from console.users by\
        \ UUID, including email, enabled status, MFA enrollment flag, and timestamps.\
        \ Requires console:user.read scope."
      operationId: console__users__get
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Get console user account details by UUID
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: get
    put:
      description: "Modifies email or enabled status of a console user in console.users.\
        \ If account is disabled, immediately revokes all active sessions in console.sessions.\
        \ Emits console.user.updated event. Requires console:user.write scope."
      operationId: console__users__update
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UpdateConsoleUserInput"
        description: Request body for console.UpdateConsoleUserInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
      summary: Update console user account properties
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: update
  /v1/_/console/users/{user_id}/password:
    post:
      description: "Updates password hash in console.users using Argon2id key derivation\
        \ and revokes all active sessions in console.sessions, forcing re-login across\
        \ all devices. Emits console.user.password_reset event. Requires console:user.write\
        \ scope."
      operationId: console__users__reset_password
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ResetConsoleUserPasswordInput"
        description: Request body for console.ResetConsoleUserPasswordInput
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
      summary: Reset console user password and revoke sessions
      tags:
      - Users
      x-sdk-group-name:
      - console
      - users
      x-sdk-method-name: reset_password
  /v1/_/console/users/{user_id}/sessions:
    get:
      description: "Returns all active sessions from console.sessions for the specified\
        \ console user, including client IP address, user-agent string, creation timestamp,\
        \ and expiration time. Requires console:user.read scope."
      operationId: console__users__sessions__list
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
                default: null
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
                default: null
          description: OK
      summary: List active sessions for a console user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: list
  /v1/_/console/users/{user_id}/sessions/revoke:
    post:
      description: "Terminates all active sessions in console.sessions for the specified\
        \ console user, immediately invalidating cookie tokens. Emits console.user.sessions.revoked_all\
        \ event. Requires console:user.write scope."
      operationId: console__users__sessions__revoke
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Empty"
        description: Request body for core.Empty
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Sessions revoked
      summary: Revoke all active sessions for a console user
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: revoke
  /v1/_/console/users/{user_id}/sessions/{session_id}:
    delete:
      description: Terminates a single session by session UUID from console.sessions
        for the specified console user. Emits console.user.session.revoked event.
        Requires console:user.write scope.
      operationId: console__users__sessions__delete
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
            application/xml:
              schema:
                $ref: "#/components/schemas/Empty"
          description: OK
        "204":
          description: Session revoked
      summary: Revoke a specific console user session
      tags:
      - Users Sessions
      x-sdk-group-name:
      - console
      - users
      - sessions
      x-sdk-method-name: delete
components:
  schemas:
    Config:
      description: Config schema
      example:
        allowed_cidrs:
        - allowed_cidrs
        - allowed_cidrs
        audit_retention_days: 0
        mfa_enforced: true
        session_idle_timeout_seconds: 6
        session_max_lifetime_seconds: 1
      properties:
        allowed_cidrs:
          items:
            type: string
          nullable: true
          type: array
          default: null
        audit_retention_days:
          type: integer
        mfa_enforced:
          type: boolean
        session_idle_timeout_seconds:
          type: integer
        session_max_lifetime_seconds:
          type: integer
      required:
      - allowed_cidrs
      - audit_retention_days
      - mfa_enforced
      - session_idle_timeout_seconds
      - session_max_lifetime_seconds
    CreateConsoleUserInput:
      description: CreateConsoleUserInput schema
      example:
        email: email
        password: password
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    Empty:
      description: Empty schema
    ResetConsoleUserPasswordInput:
      description: ResetConsoleUserPasswordInput schema
      example:
        new_password: new_password
      properties:
        new_password:
          type: string
      required:
      - new_password
    Session:
      description: Session schema
      example:
        created_at: 2000-01-23T04:56:07.000+00:00
        expires_at: 2000-01-23T04:56:07.000+00:00
        id: id
        ip_address: ip_address
        user_agent: user_agent
        user_id: user_id
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        user_id:
          type: string
      required:
      - created_at
      - expires_at
      - id
      - ip_address
      - user_agent
      - user_id
    UpdateConsoleUserInput:
      description: UpdateConsoleUserInput schema
      example:
        email: email
        is_enabled: true
      properties:
        email:
          type: string
          nullable: true
        is_enabled:
          type: boolean
          nullable: true
    User:
      description: User schema
      example:
        created_at: 2000-01-23T04:56:07.000+00:00
        email: email
        id: id
        is_enabled: true
        last_signed_in_at: 2000-01-23T04:56:07.000+00:00
        last_updated_at: 2000-01-23T04:56:07.000+00:00
        mfa_enabled: true
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        is_enabled:
          type: boolean
        last_signed_in_at:
          format: date-time
          type: string
          nullable: true
        last_updated_at:
          format: date-time
          type: string
        mfa_enabled:
          type: boolean
      required:
      - created_at
      - email
      - id
      - is_enabled
      - last_updated_at
      - mfa_enabled
    unknown-interface:
      description: unknown-interface schema
